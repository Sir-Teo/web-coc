<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b3a6"/><stop offset="1" stop-color="#8f897c"/>
    </linearGradient>
    <linearGradient id="stoneLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d675c"/><stop offset="1" stop-color="#7d776b"/>
    </linearGradient>
    <linearGradient id="stoneRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b564d"/><stop offset="1" stop-color="#4a463f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.95"/><stop offset="0.45" stop-color="#ffb43a" stop-opacity="0.75"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 3x3 stone platform, shared by every Crafted Defense -->
  <g stroke="#2f2b25" stroke-width="2" stroke-linejoin="round">
    <path d="M90 92 L172 133 L90 174 L8 133 Z" fill="url(#stoneTop)"/>
    <path d="M8 133 L90 174 L90 180 L8 139 Z" fill="url(#stoneLeft)"/>
    <path d="M90 174 L172 133 L172 139 L90 180 Z" fill="url(#stoneRight)"/>
  </g>
  <g stroke="#6f695d" stroke-width="1.4" opacity="0.8" fill="none">
    <path d="M36 119 L118 160"/><path d="M63 105 L145 146"/><path d="M36 147 L118 106"/><path d="M63 161 L145 120"/>
  </g>

  <defs>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7e7c6"/><stop offset="0.55" stop-color="#fff8e8"/><stop offset="1" stop-color="#d9c29a"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5f6b"/><stop offset="0.5" stop-color="#8d94a3"/><stop offset="1" stop-color="#3f434c"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a14"/><stop offset="0.5" stop-color="#ffab2e"/><stop offset="1" stop-color="#fff2a6"/>
    </linearGradient>
  </defs>
  <!-- iron candle tray -->
  <g stroke="#23252b" stroke-width="2.2">
    <ellipse cx="90" cy="130" rx="46" ry="22" fill="url(#iron)"/>
    <path d="M44 130 Q90 160 136 130 L136 122 Q90 150 44 122 Z" fill="#3c3f47"/>
    <ellipse cx="90" cy="122" rx="46" ry="21" fill="#737a88"/>
  </g>
  <!-- three candles, tallest in the middle -->
  <g stroke="#6b5530" stroke-width="2">
    <path d="M52 118 L52 82 Q61 77 70 82 L70 118 Q61 123 52 118 Z" fill="url(#wax)"/>
    <path d="M110 118 L110 88 Q119 83 128 88 L128 118 Q119 123 110 118 Z" fill="url(#wax)"/>
    <path d="M76 124 L76 52 Q90 45 104 52 L104 124 Q90 131 76 124 Z" fill="url(#wax)"/>
  </g>
  <!-- wax drips -->
  <g fill="#fffaf0" stroke="#c9b089" stroke-width="1.2">
    <path d="M80 54 Q82 70 79 74 Q76 68 78 55 Z"/><path d="M98 54 Q101 76 97 80 Q94 70 96 55 Z"/>
    <path d="M56 84 Q58 95 55 98 Q53 92 54 85 Z"/><path d="M122 90 Q124 100 121 103 Q119 97 120 91 Z"/>
  </g>
  <!-- wicks and flames -->
  <g stroke="#2a1d10" stroke-width="2"><path d="M90 50 L90 42"/><path d="M61 80 L61 74"/><path d="M119 86 L119 80"/></g>
  <circle cx="90" cy="26" r="26" fill="url(#glow)"/>
  <circle cx="61" cy="62" r="15" fill="url(#glow)"/>
  <circle cx="119" cy="68" r="15" fill="url(#glow)"/>
  <g stroke="#b83a08" stroke-width="1.6">
    <path d="M90 6 Q104 26 97 38 Q90 46 83 38 Q76 26 90 6 Z" fill="url(#flame)"/>
    <path d="M61 52 Q69 63 65 70 Q61 75 57 70 Q53 63 61 52 Z" fill="url(#flame)"/>
    <path d="M119 58 Q127 69 123 76 Q119 81 115 76 Q111 69 119 58 Z" fill="url(#flame)"/>
  </g>
</svg>
