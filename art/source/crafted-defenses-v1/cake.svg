<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b3a6"/><stop offset="1" stop-color="#8f897c"/>
    </linearGradient>
    <linearGradient id="stoneLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d675c"/><stop offset="1" stop-color="#7d776b"/>
    </linearGradient>
    <linearGradient id="stoneRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b564d"/><stop offset="1" stop-color="#4a463f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.95"/><stop offset="0.45" stop-color="#ffb43a" stop-opacity="0.75"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 3x3 stone platform, shared by every Crafted Defense -->
  <g stroke="#2f2b25" stroke-width="2" stroke-linejoin="round">
    <path d="M90 92 L172 133 L90 174 L8 133 Z" fill="url(#stoneTop)"/>
    <path d="M8 133 L90 174 L90 180 L8 139 Z" fill="url(#stoneLeft)"/>
    <path d="M90 174 L172 133 L172 139 L90 180 Z" fill="url(#stoneRight)"/>
  </g>
  <g stroke="#6f695d" stroke-width="1.4" opacity="0.8" fill="none">
    <path d="M36 119 L118 160"/><path d="M63 105 L145 146"/><path d="M36 147 L118 106"/><path d="M63 161 L145 120"/>
  </g>

  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a2b"/><stop offset="0.5" stop-color="#b47a3e"/><stop offset="1" stop-color="#6c4420"/>
    </linearGradient>
    <linearGradient id="sponge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d08c"/><stop offset="1" stop-color="#d9a55a"/>
    </linearGradient>
    <linearGradient id="icing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc1dd"/><stop offset="1" stop-color="#f27fb2"/>
    </linearGradient>
  </defs>
  <!-- catapult frame -->
  <g stroke="#3b230d" stroke-width="2.2" stroke-linejoin="round" fill="url(#wood)">
    <path d="M46 126 L60 84 L68 86 L58 130 Z"/>
    <path d="M122 130 L112 86 L120 84 L134 126 Z"/>
    <path d="M40 124 L140 124 L140 134 L40 134 Z"/>
    <path d="M56 90 L124 90 L124 98 L56 98 Z"/>
  </g>
  <!-- throwing arm, cocked back -->
  <g stroke="#3b230d" stroke-width="2.2" stroke-linejoin="round">
    <path d="M86 118 L104 40 L112 42 L95 120 Z" fill="url(#wood)"/>
    <circle cx="90" cy="94" r="7" fill="#6f747e"/>
    <path d="M92 40 Q108 28 126 40 L122 48 Q108 40 96 48 Z" fill="#7d4e22"/>
  </g>
  <!-- the cake in the bucket -->
  <g stroke="#7a3a19" stroke-width="1.8">
    <path d="M94 30 L94 42 Q109 49 124 42 L124 30 Z" fill="url(#sponge)"/>
    <ellipse cx="109" cy="30" rx="15" ry="6" fill="url(#icing)"/>
    <path d="M96 32 Q97 38 99 36 Q101 40 103 34 Q106 40 108 35 Q111 41 113 35 Q116 39 118 34 Q121 38 122 32" fill="#f27fb2" stroke="none"/>
  </g>
  <path d="M109 16 L109 25" stroke="#e8e0cf" stroke-width="3"/>
  <path d="M109 9 Q113 14 109 18 Q105 14 109 9 Z" fill="#ffb13a" stroke="#b85a08" stroke-width="1.2"/>
  <circle cx="102" cy="27" r="2" fill="#d6203a"/><circle cx="116" cy="28" r="2" fill="#3fa8e0"/>
  <!-- counterweight -->
  <path d="M80 116 L98 116 L100 128 L78 128 Z" fill="#5d626c" stroke="#23252b" stroke-width="2"/>
</svg>
