name: Deploy to Firebase Hosting

# Builds Crown & Clan and deploys it to the coc-teozeng Firebase Hosting site
# (https://coc.teozeng.dev) on every push to main. Requires one repo secret:
# FIREBASE_TOKEN. Generate it locally with:  firebase login:ci
# then add it under GitHub repo Settings -> Secrets and variables -> Actions
# as a secret named FIREBASE_TOKEN.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialize runs for each ref, keeping pull-request checks from cancelling a
# live release. Only the newest main-branch run should publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The simulation rules carry the whole game loop, so a red suite must not
      # reach players. `npm run build` type-checks before it bundles.
      - run: npm test
      - run: node scripts/specialist-walk-assets.mjs --check
      - run: node scripts/mortar-assets.mjs --check
      - run: npm run build

      # Exhaustive browser regressions run through browser-regression.yml on
      # demand. Releases keep a bounded check of the actual production bundle.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps --only-shell chromium

      - name: Verify production build and offline play
        timeout-minutes: 3
        run: npm run test:production
        env:
          PRODUCTION_BROWSER: chromium

      - name: Preserve browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: output/playtest/
          retention-days: 7
          if-no-files-found: ignore

      # A pull request builds and tests only. Publishing stays on main so a
      # branch can never take over the live site.
      - name: Deploy to Firebase Hosting
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # Deploy is pinned to the coc-teozeng site so it cannot overwrite the
        # other sites in this project (teozeng.dev, finos.teozeng.dev).
        # Treat the "version is already the current active version" response as
        # success: it means the live channel already serves this exact build, so
        # there is nothing to release. Any other non-zero exit still fails the job.
        run: |
          set -o pipefail
          out=$(npx --yes firebase-tools@latest deploy --only hosting:coc-teozeng \
            --project personal-website-3bc37 --non-interactive 2>&1 | tee /dev/stderr) || code=$?
          if [ -n "${code:-}" ]; then
            if printf '%s' "$out" | grep -qiE 'current active version|Nothing to deploy|no changes'; then
              echo "::notice::Live channel already serves this build — nothing new to release."
              exit 0
            fi
            exit "$code"
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
