name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore production WebP encodings
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/webp-dist
          key: webp-dist-${{ hashFiles('public/assets/**/*.png', 'scripts/webp-dist.mjs') }}
          restore-keys: webp-dist-
      - name: Check types, documentation and production build
        run: npm run typecheck:tests && npm run test:docs && npm run build
      - name: Deploy to Firebase Hosting
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx --yes firebase-tools@15.30.2 deploy --only hosting:coc-teozeng --project personal-website-3bc37 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
