name: Browser regression (on demand)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.browser }} (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell ${{ matrix.browser }}

      # Distribute individual tests, including large spec files, across runners.
      # One browser worker per runner avoids competing for software-rendering CPU.
      - name: Verify generated campaign scenery
        if: matrix.browser == 'chromium' && matrix.shard == 1
        run: node scripts/campaign-scenery-assets.mjs --check

      - name: Run browser regressions
        run: npx playwright test --browser=${{ matrix.browser }} --fully-parallel --shard=${{ matrix.shard }}/4 --workers=1 --reporter=line

      - name: Verify Retina terrain and camera coverage
        if: matrix.browser == 'webkit' && matrix.shard == 4
        run: npx playwright test tests/browser/terrain-field.spec.ts tests/browser/village-camera.spec.ts tests/browser/native-campaign.spec.ts --config=playwright.retina.config.ts --browser=webkit

      - name: Build production bundle
        if: matrix.shard == 1
        run: npm run build
      - name: Verify production bundle
        if: matrix.shard == 1
        timeout-minutes: 3
        run: npm run test:production
        env:
          PRODUCTION_BROWSER: ${{ matrix.browser }}

      - name: Verify native campaign production flows
        if: matrix.shard == 1
        timeout-minutes: 3
        run: npm run test:campaign:production
        env:
          PRODUCTION_BROWSER: ${{ matrix.browser }}

      - name: Preserve browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            output/test-results/
            output/retina-results/
            output/playtest/
          retention-days: 7
          if-no-files-found: ignore
